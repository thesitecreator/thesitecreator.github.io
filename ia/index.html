<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Assistant</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="dark">
  <main class="landing">
    <section class="card intro-card">
      <div class="logo">✦</div>
      <h1>Bienvenue</h1>
      <p>Avant de commencer la discussion, indique simplement tes informations.</p>

      <form id="registerForm">
        <label>Prénom<input id="firstName" required maxlength="60" autocomplete="given-name"></label>
        <label>Nom<input id="lastName" required maxlength="60" autocomplete="family-name"></label>
        <label>Âge<input id="age" required type="number" min="1" max="120"></label>
        <label class="consent">
          <input type="checkbox" id="consent" required>
          <span>J’accepte que ces informations soient utilisées pour cette conversation.</span>
        </label>
        <button class="primary" type="submit">Continuer <span>→</span></button>
        <p class="error" id="registerError"></p>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
