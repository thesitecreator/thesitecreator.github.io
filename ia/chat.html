<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conversation</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="dark chat-page">
  <header class="topbar">
    <div class="brand"><span class="logo small">✦</span> Assistant</div>
    <div class="user-pill" id="userPill"></div>
  </header>

  <main class="chat-shell">
    <div class="chat-header">
      <h1>Conversation</h1>
      <p>Écris ton message ci-dessous.</p>
    </div>

    <section id="messages" class="messages" aria-live="polite"></section>

    <form id="messageForm" class="composer">
      <textarea id="messageInput" rows="1" maxlength="2000" placeholder="Écris ton message..." required></textarea>
      <button class="send" type="submit" aria-label="Envoyer">↑</button>
    </form>
    <p class="hint">Les réponses sont envoyées depuis l’équipe.</p>
  </main>
  <script src="/chat.js"></script>
</body>
</html>
